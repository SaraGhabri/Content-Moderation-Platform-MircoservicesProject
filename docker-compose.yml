services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: content-moderation-platform-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "bash", "-c", "echo ruok | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: content-moderation-platform-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  classification-service:
    build: 
      context: ./classification-service
      dockerfile: Dockerfile
    container_name: classification-service
    ports:
      - "50051:50051"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  api-gateway:
    build: 
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_healthy
      classification-service:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: api-gateway
      CLASSIFICATION_SERVICE_URL: classification-service:50051
      NODE_ENV: development
      PORT: 3000
    networks:
      - app-network
    restart: unless-stopped

  content-service:
    build: 
      context: ./content-service
      dockerfile: Dockerfile
    container_name: content-service
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
    networks:
      - app-network
    restart: unless-stopped

  moderation-worker:
    build: 
      context: ./moderation-worker
      dockerfile: Dockerfile
    container_name: moderation-worker
    depends_on:
      kafka:
        condition: service_healthy
      classification-service:
        condition: service_started
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_GROUP_ID: moderation-workers
      KAFKA_CLIENT_ID: moderation-worker-1
      CLASSIFICATION_SERVICE_URL: classification-service:50051
      NODE_ENV: development
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
    name: content-moderation-network