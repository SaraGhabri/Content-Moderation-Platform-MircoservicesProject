replicaCount: 1

image:
  repository: sarahghabri/api-gateway
  tag: "10"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: PORT
    value: "3000"
  - name: KAFKA_BROKER
    value: "kafka:9092"
  - name: KAFKA_CLIENT_ID
    value: "api-gateway"
  - name: CLASSIFICATION_SERVICE_URL
    value: "classification-service:50051"
  - name: NODE_ENV
    value: "production"

livenessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 3000
  initialDelaySeconds: 20
  periodSeconds: 5
