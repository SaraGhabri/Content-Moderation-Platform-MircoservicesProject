replicaCount: 1

image:
  repository: sarahghabri/content-service
  tag: "10"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3001
  targetPort: 3001

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

env:
  - name: PORT
    value: "3001"
  - name: KAFKA_BROKER
    value: "kafka:9092"
  - name: KAFKA_CLIENT_ID
    value: "content-service"
  - name: NODE_ENV
    value: "production"

livenessProbe:
  httpGet:
    path: /
    port: 3001
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /
    port: 3001
  initialDelaySeconds: 20
  periodSeconds: 5
