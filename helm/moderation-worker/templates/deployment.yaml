apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "moderation-worker.fullname" . }}
  labels:
    {{- include "moderation-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "moderation-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "moderation-worker.selectorLabels" . | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Kafka..."
              until nc -z kafka 9092; do
                echo "Kafka not ready, waiting..."
                sleep 5
              done
              echo "Kafka is ready!"

        - name: wait-for-classification-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Waiting for Classification Service..."
              until nc -z classification-service 50051; do
                echo "Classification Service not ready, waiting..."
                sleep 5
              done
              echo "Classification Service is ready!"
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- toYaml .Values.env | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
